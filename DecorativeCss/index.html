<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Decorative CSS</title>
</head>
<body>
    <div class="container">
        <section class="main-section">
            <h2 class="main-section__title">1. Element Shadows</h2>
            <div class="example-row">
                <div class="example-box shadow-basic">Shadow Basic</div>
                <div class="example-box shadow-blur">Shadow Blur</div>
                <div class="example-box shadow-multiple">Shadow Multiple</div>
            </div>
        </section>

        <section class="main-section">
            <h2 class="main-section__title">2. Text Shadows</h2>
            <div class="example-row">
                <div class="example-box shadow-basic-text">Shadow Basic - text</div>
                <div class="example-box shadow-glow">Shadow glow</div>
            </div>
        </section>  

        <section class="main-section">
            <h2 class="main-section__title">3. Borders</h2>
            <div class="example-row">
                <div class="example-box border-radius">Border Radius</div>
                <div class="example-box border-image">Border Image</div>
                <div class="example-box outline-effect">Outline Effect</div>
            </div>
        </section>  

        <section class="main-section">
            <h2 class="main-section__title">4. Filters</h2>
            <div class="example-row">
                <div class="example-box filter-blur">Blur Filter</div>
            </div>
        </section>  
</body>
</html>
